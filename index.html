<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GymLog - Gelişmiş Fitness Takip ve Gelişim Asistanı</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
    <div class="app-container">
        <!-- Sidebar / Nav -->
        <nav class="glass-panel sidebar">
            <div class="logo">
                <i data-lucide="dumbbell" class="icon-large text-primary"></i>
                <h2>GymLog</h2>
            </div>
            <ul class="nav-links">
                <li class="active"><a href="#" data-view="workout"><i data-lucide="activity"></i> Antrenman</a></li>
                <li><a href="#" data-view="levels"><i data-lucide="flame"></i> Seviyem</a></li>
                <li><a href="#" data-view="calendar"><i data-lucide="calendar"></i> Takvim</a></li>
                <li><a href="#" data-view="profile"><i data-lucide="user"></i> Profilim</a></li>
            </ul>
        </nav>

        <!-- Main Content Area -->
        <main class="main-content" id="main-content">
            <!-- Dinamik olarak JS ile doldurulacak -->
        </main>
    </div>
    
    <script src="app.js"></script>
</body>
</html>
